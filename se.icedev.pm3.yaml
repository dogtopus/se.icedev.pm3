app-id: 'se.icedev.pm3'

x-pm3-version: &pm3-version 'v4.20728'

runtime: 'org.kde.Platform'
runtime-version: '5.15-25.08'
sdk: 'org.kde.Sdk'

command: 'pm3'
rename-icon: proxmark3
rename-desktop-file: proxmark3.desktop

add-extensions:
  se.icedev.pm3.firmware:
    version: *pm3-version
    directory: share/proxmark3/firmware/extras
    subdirectories: true
    no-autodownload: true
    autodelete: true

cleanup:
  - '/share/info'
  - '/share/man'
  #- '/lib/udev/rules.d'

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/share/proxmark3/firmware/extras

finish-args:
  # Default Proxmark config directory
  - '--persist=.proxmark3'
  # Allow device access for wired connectivity
  - '--device=all'
  # Allow Bluetooth for RDV4 wireless connectivity
  - '--allow=bluetooth'

modules:
  - 'arm-gnu-toolchain.yaml'

  - name: 'proxmark3'
    no-autogen: true
    make-args:
      - 'PLATFORM=PM3GENERIC'
      - 'SKIPQT=0'
    make-install-args:
      - 'PREFIX=/app'
      - 'UDEV_PREFIX=/app/lib/udev/rules.d'
    sources:
      - type: git
        url: 'https://github.com/RfidResearchGroup/proxmark3.git'
        tag: *pm3-version

  - name: 'desktop'
    buildsystem: simple
    sources:
      - type: file
        path: proxmark3.desktop
      - type: file
        path: proxmark3.png
      - type: file
        path: se.icedev.pm3.metainfo.xml
    build-commands:
      - 'mkdir -p ${FLATPAK_DEST}/share/applications/'
      - 'mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/'
      - 'install -m644 proxmark3.desktop ${FLATPAK_DEST}/share/applications/'
      - 'install -m644 proxmark3.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/'
      - 'install -Dm644 -t ${FLATPAK_DEST}/share/metainfo se.icedev.pm3.metainfo.xml'
