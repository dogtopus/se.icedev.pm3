app-id: 'se.icedev.pm3'

runtime: 'org.kde.Platform'
runtime-version: '5.15-25.08'
sdk: 'org.kde.Sdk'

command: 'pm3'
rename-icon: proxmark3
rename-desktop-file: proxmark3.desktop

cleanup:
  - '/share/info'
  - '/share/man'
  #- '/lib/udev/rules.d'

finish-args:
  # Default Proxmark config directory
  - '--persist=.proxmark3'
  # Allow device access for wired connectivity
  - '--device=all'
  # Allow Bluetooth for RDV4 wireless connectivity
  - '--allow=bluetooth'

modules:
  - name: arm_toolchain
    buildsystem: simple
    # Change the following to use another version
    sources:
      - type: file
        only-arches:
          - x86_64
        url: 'https://armkeil.blob.core.windows.net/developer/files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz'
        sha256: 597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16
        dest-filename: arm-gnu-toolchain.tar.xz
      - type: file
        only-arches:
          - aarch64
        url: 'https://armkeil.blob.core.windows.net/developer/files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-aarch64-arm-none-eabi.tar.xz'
        sha256: d061559d814b205ed30c5b7c577c03317ec447ca51cd5a159d26b12a5bbeb20c
        dest-filename: arm-gnu-toolchain.tar.xz
    build-commands:
        - tar -xf arm-gnu-toolchain.tar.xz --strip-components=1 -C $FLATPAK_DEST
    cleanup:
      - '*'

  - name: 'proxmark3'
    no-autogen: true
    make-args:
      - 'PLATFORM=PM3GENERIC'
      - 'SKIPQT=0'
    make-install-args:
      - 'PREFIX=/app'
      - 'UDEV_PREFIX=/app/lib/udev/rules.d'
    sources:
      - type: git
        url: 'https://github.com/RfidResearchGroup/proxmark3.git'
        tag: 'v4.20728'

  - name: 'desktop'
    buildsystem: simple
    sources:
      - type: file
        path: proxmark3.desktop
      - type: file
        path: proxmark3.png
    build-commands:
      - 'mkdir -p ${FLATPAK_DEST}/share/applications/'
      - 'mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/'
      - 'install -m644 proxmark3.desktop ${FLATPAK_DEST}/share/applications/'
      - 'install -m644 proxmark3.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/'
